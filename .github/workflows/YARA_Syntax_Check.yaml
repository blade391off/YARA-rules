name: YARA Advanced CI

on:
  push:
    paths: [ '**.yar', '**.yara', '.github/workflows/**' ]
  pull_request:
    paths: [ '**.yar', '**.yara' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yara-validation:
    name: Validate Rules Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install YARA Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y yara

      - name: Execute Syntax Verification
        run: |
          echo "=== STARTING YARA SYNTAX SCAN ==="
          find . -type f \( -name "*.yar" -o -name "*.yara" \) -print0 | xargs -0 yara -w /dev/null
