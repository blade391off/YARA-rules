name: YARA Advanced CI

on:
  push:
    paths: [ '**.yar', '**.yara', '.github/workflows/**' ]
  pull_request:
    paths: [ '**.yar', '**.yara' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yara-validation:
    name: Validate Rules Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install YARA Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y yara

      - name: Execute Syntax Verification
        run: |
          echo "=== STARTING YARA SYNTAX SCAN ==="
          FAILED=0
          
          while IFS= read -r -d '' rule_file; do
            if ! yara -w "$rule_file" /dev/null; then
              FAILED=1
            fi
          done < <(find . -type f \( -name "*.yar" -o -name "*.yara" \) -print0)
          
          if [ $FAILED -ne 0 ]; then
            echo "=== VALIDATION FAILED ==="
            exit 1
          fi
          
          echo "=== ALL RULES ARE VALID AND CLEAN ==="
