name: YARA Advanced CI

on:
  push:
    paths:
      - '**.yar'
      - '**.yara'
      - '.github/workflows/YARA_Syntax_Check.yaml'
  pull_request:
    paths:
      - '**.yar'
      - '**.yara'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yara-validation:
    name: Validate Rules Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Cache YARA Packages
        id: cache-yara
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-yara-apt-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yara-apt-

      - name: Install YARA Core Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y yara

      - name: Execute Recursive Syntax Verification
        run: |
          echo "=== STARTING YARA SYNTAX SCAN ==="
          FAILED=0
          touch /tmp/empty
          
          while IFS= read -r -d '' rule_file; do
            echo "🔬 Reviewing: $rule_file"
            
            if ! yara "$rule_file" /tmp/empty; then
              echo "❌ ERROR: Syntax validation failed in $rule_file"
              FAILED=1
            fi
          done < <(find . -type f \( -name "*.yar" -o -name "*.yara" \) -print0)
          
          if [ $FAILED -ne 0 ]; then
            echo "=== VALIDATION FAILED ==="
            exit 1
          fi
          
          echo "=== ALL RULES ARE VALID AND CLEAN ==="
