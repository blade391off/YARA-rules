name: YARA False Negatives

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  false-negatives:
    name: YARA False Negatives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y yara
          yara --version

      - name: Run false-negative tests
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          expected_file = Path("tests/false-negatives/expected.json")
          samples_dir = Path("tests/false-negatives/samples")

          if not expected_file.is_file():
              print("ERROR: expected.json not found")
              sys.exit(1)

          if not samples_dir.is_dir():
              print("ERROR: samples directory not found")
              sys.exit(1)

          with expected_file.open("r", encoding="utf-8") as f:
              tests = json.load(f)

          
          rule_files = [
              p for p in Path(".").rglob("*")
              if p.is_file()
              and p.suffix.lower() in {".yar", ".yara"}
              and ".git" not in p.parts
          ]

          if not rule_files:
              print("ERROR: no .yar/.yara files found")
              sys.exit(1)

          print("YARA rules:")
          for rule in rule_files:
              print(f"  - {rule}")

          print()

          failed = 0
          total = 0

          for sample_name, expected_rules in tests.items():
              sample = samples_dir / sample_name

              if not sample.is_file():
                  print(f"FAIL: sample not found: {sample}")
                  failed += 1
                  continue

              
              command = [
                  "yara",
                  "-r",
                  "-w",
              ]

              command.extend(str(rule) for rule in rule_files)
              command.append(str(sample))

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True
              )

              matches = result.stdout.splitlines()

              matched_rules = {
                  line.split(maxsplit=1)[0]
                  for line in matches
                  if line.strip()
              }

              for expected_rule in expected_rules:
                  total += 1

                  if expected_rule in matched_rules:
                      print(
                          f"PASS: {expected_rule} -> {sample_name}"
                      )
                  else:
                      print(
                          f"FAIL: {expected_rule} -> {sample_name}"
                      )
                      failed += 1

          print()
          print("----------------------------------------")
          print(f"Tests: {total}")
          print(f"False negatives: {failed}")
          print("----------------------------------------")

          if failed:
              print("False negatives found.")
              sys.exit(1)

          print("No false negatives found.")
          PY
